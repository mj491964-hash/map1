<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부산 상권 지도 탐색기</title>
  <meta name="description" content="부산광역시 내 대형마트, 백화점, 헬스장, 편의점 상권 데이터 지도 시각화 및 밀집도 탐색 웹페이지">

  <!-- Google Fonts: Pretendard -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loader-spinner"></div>
    <div class="loader-text" id="loading-text">부산 상권 데이터를 준비하고 있습니다...</div>
    <div class="loader-subtext">5,900여 개 상점 위치 및 밀집도 분석 중</div>
  </div>

  <!-- Header Navbar -->
  <header id="app-header">
    <div class="brand-section">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
      </div>
      <div class="brand-text">
        <h1>부산 상권 지도 탐색기</h1>
        <div class="sub-title">
          <span>부산시 주요 상권 및 점포 시각화</span>
          <span class="status-badge"><span class="status-dot"></span>실시간 상권 분석</span>
        </div>
      </div>
    </div>

    <!-- Stats Badges in Header -->
    <div class="header-actions">
      <div class="stats-card-group">
        <div class="stat-chip">
          <span>총 상점</span>
          <strong id="stat-total-count">-</strong>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-chip" title="대형마트 입점점포">
          <span style="color: var(--color-mart)">● 대형마트</span>
          <strong id="stat-mart-count">-</strong>
        </div>
        <div class="stat-chip" title="백화점 입점점포">
          <span style="color: var(--color-department)">● 백화점</span>
          <strong id="stat-dept-count">-</strong>
        </div>
        <div class="stat-chip" title="헬스장">
          <span style="color: var(--color-gym)">● 헬스장</span>
          <strong id="stat-gym-count">-</strong>
        </div>
        <div class="stat-chip" title="편의점">
          <span style="color: var(--color-cvs)">● 편의점</span>
          <strong id="stat-cvs-count">-</strong>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Map Viewport -->
  <main id="map-viewport">
    <div id="map"></div>

    <!-- Floating Top Control Panel -->
    <div class="floating-control-panel">
      <!-- Store Search Box -->
      <div class="search-box-wrapper glass-box">
        <div class="search-input-group">
          <span class="search-icon">🔍</span>
          <input type="text" id="store-search-input" placeholder="상호명, 주소 검색 (예: 이마트, 서면, CU)" autocomplete="off">
          <button id="search-clear-btn" class="search-clear-btn hidden" title="검색어 지우기">✕</button>
        </div>
        <!-- Realtime Search Dropdown -->
        <div id="search-results-dropdown" class="search-results-dropdown hidden"></div>
      </div>

      <!-- Hotspot Heatmap Mode Toggle -->
      <button id="hotspot-toggle-btn" class="hotspot-toggle-btn" title="상가 밀집 구역을 붉은색 히트맵으로 시각화">
        <span class="btn-icon">🔥</span>
        <span class="btn-label">밀집도(핫스팟) 보기</span>
      </button>

      <!-- Map Utility Controls -->
      <div class="glass-box map-tool-group">
        <button id="btn-reset-view" class="tool-btn" title="부산 전체 영역으로 이동">
          <span>🧭</span>
          <span>부산 전체 보기</span>
        </button>
        <button id="btn-locate-user" class="tool-btn" title="내 위치(GPS)로 이동">
          <span>📍</span>
          <span>내 현재 위치</span>
        </button>

        <div style="margin: 4px 0; border-top: 1px solid var(--border-glass);"></div>

        <!-- Korean Layer Switcher -->
        <div class="layer-switcher">
          <button class="layer-btn active" data-layer="vworld-base" title="국토교통부 표준 전자지도">기본 지도</button>
          <button class="layer-btn" data-layer="vworld-white" title="깔끔하고 선명한 백지도">백지도</button>
          <button class="layer-btn" data-layer="vworld-midnight" title="눈이 편안한 야간 다크 지도">야간 지도</button>
        </div>
      </div>
    </div>

    <!-- Floating Bottom Legend Panel -->
    <div class="floating-legend-panel glass-box">
      <div class="legend-title">상점 분류 범례</div>
      <div class="legend-items-grid">
        <div class="legend-item">
          <span class="legend-badge mart"></span>
          <span>대형마트 점포</span>
        </div>
        <div class="legend-item">
          <span class="legend-badge dept"></span>
          <span>백화점 입점점포</span>
        </div>
        <div class="legend-item">
          <span class="legend-badge gym"></span>
          <span>헬스장 (피트니스)</span>
        </div>
        <div class="legend-item">
          <span class="legend-badge cvs"></span>
          <span>편의점 (24시)</span>
        </div>
      </div>

      <!-- Density Legend Bar (핵심 요구사항: 밀집 상가 빨간색) -->
      <div class="density-legend-bar">
        <div class="legend-title" style="margin-bottom: 4px;">상가 밀집도 클러스터</div>
        <div class="density-scale">
          <div class="density-chip high" title="상가가 50개 이상 집중된 핵심 상권 (서면, 남포동 등)">
            <span>🔴 50개+ (밀집)</span>
          </div>
          <div class="density-chip mid">
            <span>🟠 20~49개</span>
          </div>
          <div class="density-chip low">
            <span>🟢 2~19개</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Leaflet Core JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet Heat JS -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Store Data (No-CORS Guaranteed) -->
  <script src="data/stores_data.js"></script>

  <!-- Application Logic -->
  <script src="js/mapManager.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
